<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe6fb">
  <title>BridgeWell World AR</title>
  <meta name="description" content="BridgeWellの小さな街を3DとARで体験できるサンプル">
  <link rel="stylesheet" href="css/style.css">
  <!-- Google model-viewer: 3D表示 + AR (Android: WebXR / Scene Viewer, iPhone: Quick Look) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>BridgeWell World</h1>
    <p>みんなでつながる、小さな未来の街</p>
  </header>

  <main class="stage">
    <model-viewer id="town"
      src="models/bridgewell_town.glb"
      alt="浮遊する島の上にあるBridgeWellのミニチュアタウン"
      camera-controls
      touch-action="pan-y"
      camera-orbit="0deg 60deg 82%"
      min-camera-orbit="auto 5deg 40%"
      max-camera-orbit="auto 88deg 200%"
      field-of-view="30deg"
      interaction-prompt="auto"
      shadow-intensity="0.7"
      shadow-softness="0.9"
      exposure="1.05"
      tone-mapping="neutral"
      environment-image="neutral"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      loading="eager">

      <div class="progress" slot="progress-bar"><div class="progress-fill"></div></div>

      <button class="ar-button" slot="ar-button" type="button">
        <span aria-hidden="true">📱</span> ARで机の上に置く
      </button>
    </model-viewer>

    <div class="hint" id="hint">1本指で回転・2本指で拡大縮小</div>
    <div class="ar-note" id="arNote" hidden>この端末・ブラウザはAR非対応のため、3D表示でお楽しみください。</div>
  </main>

  <section class="panel">
    <div class="panel-head">
      <h2>街の施設</h2>
      <button type="button" class="reset" id="resetView">全体を見る</button>
    </div>
    <ul class="facilities" id="facilityList">
      <!-- facilities.json から生成 -->
    </ul>
  </section>

  <footer class="foot">
    <a href="qr.html">QRコードを表示</a>
    <span>BridgeWell World AR · サンプル版</span>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
